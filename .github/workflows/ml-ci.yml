name: Machine Learning CI Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-train:
    name: Train Model & Export Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib

      - name: Execute Model Training Pipeline
        working-directory: ./MLProject
        run: |
          python modelling.py

      - name: Upload MLflow Experiment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: ./MLProject/mlruns/

